<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Temas + Ajuste de Imagem</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      transition: all 0.5s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: #0a1420;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 30px 24px;
      color: white;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    h1 { text-align: center; margin-bottom: 16px; }
    .preview-box {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      margin: 16px 0;
      background: #222;
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
      transition: all 0.3s;
    }
    .preview-box span { background: rgba(0,0,0,0.5); padding: 12px 24px; border-radius: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }
    .thumb {
      aspect-ratio: 1/1;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      background-color: #2a2a2a;
    }
    .thumb:hover { transform: scale(1.05); border-color: white; }
    .thumb.active { border-color: #4fd1f0; box-shadow: 0 0 20px rgba(79,209,240,0.5); }
    .thumb .label { background: rgba(0,0,0,0.6); padding: 2px 10px; border-radius: 20px; font-size: 10px; }
    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 14px;
      color: #ccc;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 16px;
    }
    .info strong { color: white; }
    .btn-reset {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.25); }
    .aviso {
      text-align: center;
      background: rgba(255,200,0,0.2);
      border: 1px solid #fbbf24;
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #fcd34d;
    }
    .ajuste-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 8px;
      flex-wrap: wrap;
    }
    .ajuste-area label {
      font-size: 14px;
      color: #ccc;
    }
    .ajuste-area select {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 14px;
      border-radius: 30px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      flex: 1;
      min-width: 150px;
    }
    .ajuste-area select option { background: #222; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Escolha seu tema</h1>
    <p style="text-align:center; opacity:0.8; margin-bottom:8px;">Clique em uma miniatura para pré-visualizar</p>

    <div id="aviso" class="aviso" style="display:none;">
      ⚠️ Imagens não encontradas. Usando cores sólidas como fallback.
    </div>

    <div class="preview-box" id="preview-box">
      <span id="preview-label">Prévia</span>
    </div>

    <!-- Seletor de ajuste -->
    <div class="ajuste-area">
      <label for="ajuste-select">🖼️ Ajuste da imagem:</label>
      <select id="ajuste-select">
        <option value="cover">Cobrir (preencher)</option>
        <option value="contain">Conter (mostrar inteira)</option>
        <option value="stretch">Esticar (distorcer)</option>
        <option value="repeat">Repetir (mosaico)</option>
        <option value="center">Centralizar (sem redimensionar)</option>
        <option value="top">Topo (sem redimensionar)</option>
        <option value="bottom">Inferior (sem redimensionar)</option>
      </select>
    </div>

    <div class="grid" id="grid-temas"></div>

    <div class="info">
      <span>📌 Tema atual: <strong id="tema-atual">--</strong> &nbsp;|&nbsp; Ajuste: <strong id="ajuste-atual">cover</strong></span>
      <button class="btn-reset" id="btn-reset">Restaurar padrão</button>
    </div>
  </div>

  <script>
    // =============================================================
    // DEFINIÇÃO DOS TEMAS (caminhos relativos)
    // =============================================================
    const temas = [
      {
        id: 'estrelado',
        nome: 'Estrelado',
        imagem: 'assets/fundos/fundo1.jpg',
        cores: { fundo: '#0a1420', card: '#101f33', texto: '#f2f7fb', primaria: '#3b82f6', secundaria: '#4fd1f0', destaque: '#f59e0b' }
      },
      {
        id: 'mar',
        nome: 'Mar',
        imagem: 'assets/fundos/fundo2.jpg',
        cores: { fundo: '#0b1a2e', card: '#1a2f44', texto: '#e6f0fa', primaria: '#0ea5e9', secundaria: '#38bdf8', destaque: '#f97316' }
      },
      {
        id: 'floresta',
        nome: 'Floresta',
        imagem: 'assets/fundos/fundo3.jpg',
        cores: { fundo: '#0f1f12', card: '#1e3322', texto: '#e6f2e6', primaria: '#22c55e', secundaria: '#4ade80', destaque: '#eab308' }
      },
      {
        id: 'por_do_sol',
        nome: 'Pôr do Sol',
        imagem: 'assets/fundos/fundo4.jpg',
        cores: { fundo: '#2a0f1a', card: '#3d1f2a', texto: '#fde8e8', primaria: '#f43f5e', secundaria: '#fb7185', destaque: '#f59e0b' }
      },
      {
        id: 'neve',
        nome: 'Neve',
        imagem: 'assets/fundos/fundo5.jpg',
        cores: { fundo: '#1a2835', card: '#2d3f4f', texto: '#f0f8ff', primaria: '#60a5fa', secundaria: '#93c5fd', destaque: '#fcd34d' }
      },
      {
        id: 'lua',
        nome: 'Lua',
        imagem: 'assets/fundos/fundo6.jpg',
        cores: { fundo: '#111827', card: '#1f2937', texto: '#f3f4f6', primaria: '#8b5cf6', secundaria: '#a78bfa', destaque: '#fbbf24' }
      },
      {
        id: 'campo',
        nome: 'Campo',
        imagem: 'assets/fundos/fundo7.jpg',
        cores: { fundo: '#0f1e0f', card: '#1e331e', texto: '#e8f0e8', primaria: '#16a34a', secundaria: '#4ade80', destaque: '#facc15' }
      },
      {
        id: 'cidade',
        nome: 'Cidade Noturna',
        imagem: 'assets/fundos/fundo8.jpg',
        cores: { fundo: '#0c0f1a', card: '#192130', texto: '#e6edf5', primaria: '#3b82f6', secundaria: '#60a5fa', destaque: '#f59e0b' }
      },
      {
        id: 'aurora',
        nome: 'Aurora',
        imagem: 'assets/fundos/fundo9.jpg',
        cores: { fundo: '#0b1120', card: '#1a2740', texto: '#e0f0ff', primaria: '#06b6d4', secundaria: '#22d3ee', destaque: '#f472b6' }
      },
      {
        id: 'vintage',
        nome: 'Vintage',
        imagem: 'assets/fundos/fundo10.jpg',
        cores: { fundo: '#1c140e', card: '#2f241c', texto: '#f5ebe0', primaria: '#d97706', secundaria: '#f59e0b', destaque: '#b45309' }
      }
    ];

    const opcoesAjuste = [
      { id: 'cover', label: 'Cobrir', value: 'cover' },
      { id: 'contain', label: 'Conter', value: 'contain' },
      { id: 'stretch', label: 'Esticar', value: '100% 100%' },
      { id: 'repeat', label: 'Repetir', value: 'auto' },
      { id: 'center', label: 'Centralizar', value: 'auto' },
      { id: 'top', label: 'Topo', value: 'auto' },
      { id: 'bottom', label: 'Inferior', value: 'auto' },
    ];

    // =============================================================
    // FUNÇÕES
    // =============================================================
    let imagensNaoEncontradas = false;

    function aplicarTema(id, ajusteId) {
      const tema = temas.find(t => t.id === id);
      if (!tema) return;
      const ajuste = opcoesAjuste.find(a => a.id === ajusteId) || opcoesAjuste[0];

      const body = document.body;
      const c = tema.cores;

      // Aplica cores (via JS direto, sem CSS variables para simplicidade no teste)
      body.style.backgroundColor = c.fundo;
      // Também podemos aplicar em elementos específicos se quiser, mas para teste só o fundo já basta

      // Aplica imagem com ajuste
      const img = new Image();
      img.src = tema.imagem;
      img.onload = () => {
        body.style.backgroundImage = `url(${tema.imagem})`;
        if (ajuste.id === 'repeat') {
          body.style.backgroundRepeat = 'repeat';
          body.style.backgroundSize = 'auto';
          body.style.backgroundPosition = '0 0';
        } else if (ajuste.id === 'stretch') {
          body.style.backgroundRepeat = 'no-repeat';
          body.style.backgroundSize = '100% 100%';
          body.style.backgroundPosition = 'center';
        } else if (ajuste.id === 'contain') {
          body.style.backgroundRepeat = 'no-repeat';
          body.style.backgroundSize = 'contain';
          body.style.backgroundPosition = 'center';
        } else if (ajuste.id === 'center') {
          body.style.backgroundRepeat = 'no-repeat';
          body.style.backgroundSize = 'auto';
          body.style.backgroundPosition = 'center';
        } else if (ajuste.id === 'top') {
          body.style.backgroundRepeat = 'no-repeat';
          body.style.backgroundSize = 'auto';
          body.style.backgroundPosition = 'top center';
        } else if (ajuste.id === 'bottom') {
          body.style.backgroundRepeat = 'no-repeat';
          body.style.backgroundSize = 'auto';
          body.style.backgroundPosition = 'bottom center';
        } else { // cover (padrão)
          body.style.backgroundRepeat = 'no-repeat';
          body.style.backgroundSize = 'cover';
          body.style.backgroundPosition = 'center';
        }
        if (imagensNaoEncontradas) {
          document.getElementById('aviso').style.display = 'none';
          imagensNaoEncontradas = false;
        }
      };
      img.onerror = () => {
        body.style.backgroundImage = 'none';
        body.style.backgroundColor = c.fundo;
        document.getElementById('aviso').style.display = 'block';
        imagensNaoEncontradas = true;
      };

      localStorage.setItem('tema_app', id);
      localStorage.setItem('ajuste_imagem', ajusteId);
      document.getElementById('ajuste-atual').textContent = ajuste.label;
    }

    function carregarTemaSalvo() {
      const temaSalvo = localStorage.getItem('tema_app');
      const ajusteSalvo = localStorage.getItem('ajuste_imagem') || 'cover';
      const existe = temas.some(t => t.id === temaSalvo);
      const id = existe ? temaSalvo : temas[0].id;
      aplicarTema(id, ajusteSalvo);
      return { temaId: id, ajusteId: ajusteSalvo };
    }

    // =============================================================
    // CONSTRUIR A INTERFACE
    // =============================================================
    const grid = document.getElementById('grid-temas');
    const previewBox = document.getElementById('preview-box');
    const previewLabel = document.getElementById('preview-label');
    const temaAtualSpan = document.getElementById('tema-atual');
    const ajusteSelect = document.getElementById('ajuste-select');

    temas.forEach(tema => {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = new Image();
      img.src = tema.imagem;
      img.onload = () => { thumb.style.backgroundImage = `url(${tema.imagem})`; };
      img.onerror = () => { thumb.style.background = tema.cores.fundo; };
      thumb.innerHTML = `<span class="label">${tema.nome}</span>`;
      thumb.dataset.id = tema.id;

      thumb.addEventListener('click', () => {
        const ajusteId = ajusteSelect.value;
        aplicarTema(tema.id, ajusteId);
        // Atualiza prévia
        const previewImg = new Image();
        previewImg.src = tema.imagem;
        previewImg.onload = () => {
          previewBox.style.backgroundImage = `url(${tema.imagem})`;
          // Aplica o mesmo ajuste na prévia
          const ajuste = opcoesAjuste.find(a => a.id === ajusteId);
          if (ajuste.id === 'repeat') {
            previewBox.style.backgroundRepeat = 'repeat';
            previewBox.style.backgroundSize = 'auto';
          } else if (ajuste.id === 'stretch') {
            previewBox.style.backgroundRepeat = 'no-repeat';
            previewBox.style.backgroundSize = '100% 100%';
          } else if (ajuste.id === 'contain') {
            previewBox.style.backgroundRepeat = 'no-repeat';
            previewBox.style.backgroundSize = 'contain';
          } else if (ajuste.id === 'center') {
            previewBox.style.backgroundRepeat = 'no-repeat';
            previewBox.style.backgroundSize = 'auto';
            previewBox.style.backgroundPosition = 'center';
          } else if (ajuste.id === 'top') {
            previewBox.style.backgroundRepeat = 'no-repeat';
            previewBox.style.backgroundSize = 'auto';
            previewBox.style.backgroundPosition = 'top center';
          } else if (ajuste.id === 'bottom') {
            previewBox.style.backgroundRepeat = 'no-repeat';
            previewBox.style.backgroundSize = 'auto';
            previewBox.style.backgroundPosition = 'bottom center';
          } else { // cover
            previewBox.style.backgroundRepeat = 'no-repeat';
            previewBox.style.backgroundSize = 'cover';
            previewBox.style.backgroundPosition = 'center';
          }
        };
        previewImg.onerror = () => {
          previewBox.style.backgroundImage = 'none';
          previewBox.style.backgroundColor = tema.cores.fundo;
        };
        previewLabel.textContent = tema.nome;
        document.querySelectorAll('.thumb').forEach(el => el.classList.remove('active'));
        thumb.classList.add('active');
        temaAtualSpan.textContent = tema.nome;
        document.getElementById('ajuste-atual').textContent = ajusteSelect.options[ajusteSelect.selectedIndex].text;
      });

      grid.appendChild(thumb);
    });

    // Carregar tema salvo
    const { temaId, ajusteId } = carregarTemaSalvo();
    const temaSalvo = temas.find(t => t.id === temaId);
    if (temaSalvo) {
      // Marca o thumb
      document.querySelectorAll('.thumb').forEach(el => {
        if (el.dataset.id === temaId) el.classList.add('active');
      });
      temaAtualSpan.textContent = temaSalvo.nome;
      // Sincroniza o select
      ajusteSelect.value = ajusteId;
      document.getElementById('ajuste-atual').textContent = opcoesAjuste.find(a => a.id === ajusteId)?.label || 'cover';
      // Prévia
      const previewImg = new Image();
      previewImg.src = temaSalvo.imagem;
      previewImg.onload = () => {
        previewBox.style.backgroundImage = `url(${temaSalvo.imagem})`;
        // Aplica ajuste na prévia (mesma lógica)
        const ajuste = opcoesAjuste.find(a => a.id === ajusteId) || opcoesAjuste[0];
        if (ajuste.id === 'repeat') {
          previewBox.style.backgroundRepeat = 'repeat';
          previewBox.style.backgroundSize = 'auto';
        } else if (ajuste.id === 'stretch') {
          previewBox.style.backgroundRepeat = 'no-repeat';
          previewBox.style.backgroundSize = '100% 100%';
        } else if (ajuste.id === 'contain') {
          previewBox.style.backgroundRepeat = 'no-repeat';
          previewBox.style.backgroundSize = 'contain';
        } else if (ajuste.id === 'center') {
          previewBox.style.backgroundRepeat = 'no-repeat';
          previewBox.style.backgroundSize = 'auto';
          previewBox.style.backgroundPosition = 'center';
        } else if (ajuste.id === 'top') {
          previewBox.style.backgroundRepeat = 'no-repeat';
          previewBox.style.backgroundSize = 'auto';
          previewBox.style.backgroundPosition = 'top center';
        } else if (ajuste.id === 'bottom') {
          previewBox.style.backgroundRepeat = 'no-repeat';
          previewBox.style.backgroundSize = 'auto';
          previewBox.style.backgroundPosition = 'bottom center';
        } else {
          previewBox.style.backgroundRepeat = 'no-repeat';
          previewBox.style.backgroundSize = 'cover';
          previewBox.style.backgroundPosition = 'center';
        }
      };
      previewImg.onerror = () => {
        previewBox.style.backgroundImage = 'none';
        previewBox.style.backgroundColor = temaSalvo.cores.fundo;
      };
      previewLabel.textContent = temaSalvo.nome;
    }

    // Quando mudar o select de ajuste, reaplica o tema atual com o novo ajuste
    ajusteSelect.addEventListener('change', function() {
      const temaAtualId = localStorage.getItem('tema_app');
      if (temaAtualId) {
        aplicarTema(temaAtualId, this.value);
        // Atualiza a prévia também
        const tema = temas.find(t => t.id === temaAtualId);
        if (tema) {
          const previewImg = new Image();
          previewImg.src = tema.imagem;
          previewImg.onload = () => {
            previewBox.style.backgroundImage = `url(${tema.imagem})`;
            const ajuste = opcoesAjuste.find(a => a.id === this.value);
            if (ajuste.id === 'repeat') {
              previewBox.style.backgroundRepeat = 'repeat';
              previewBox.style.backgroundSize = 'auto';
            } else if (ajuste.id === 'stretch') {
              previewBox.style.backgroundRepeat = 'no-repeat';
              previewBox.style.backgroundSize = '100% 100%';
            } else if (ajuste.id === 'contain') {
              previewBox.style.backgroundRepeat = 'no-repeat';
              previewBox.style.backgroundSize = 'contain';
            } else if (ajuste.id === 'center') {
              previewBox.style.backgroundRepeat = 'no-repeat';
              previewBox.style.backgroundSize = 'auto';
              previewBox.style.backgroundPosition = 'center';
            } else if (ajuste.id === 'top') {
              previewBox.style.backgroundRepeat = 'no-repeat';
              previewBox.style.backgroundSize = 'auto';
              previewBox.style.backgroundPosition = 'top center';
            } else if (ajuste.id === 'bottom') {
              previewBox.style.backgroundRepeat = 'no-repeat';
              previewBox.style.backgroundSize = 'auto';
              previewBox.style.backgroundPosition = 'bottom center';
            } else {
              previewBox.style.backgroundRepeat = 'no-repeat';
              previewBox.style.backgroundSize = 'cover';
              previewBox.style.backgroundPosition = 'center';
            }
          };
          previewImg.onerror = () => {
            previewBox.style.backgroundImage = 'none';
            previewBox.style.backgroundColor = tema.cores.fundo;
          };
        }
        document.getElementById('ajuste-atual').textContent = this.options[this.selectedIndex].text;
      }
    });

    // Botão reset
    document.getElementById('btn-reset').addEventListener('click', () => {
      const primeiro = temas[0];
      const ajustePadrao = 'cover';
      aplicarTema(primeiro.id, ajustePadrao);
      ajusteSelect.value = ajustePadrao;
      // Prévia
      const previewImg = new Image();
      previewImg.src = primeiro.imagem;
      previewImg.onload = () => {
        previewBox.style.backgroundImage = `url(${primeiro.imagem})`;
        previewBox.style.backgroundRepeat = 'no-repeat';
        previewBox.style.backgroundSize = 'cover';
        previewBox.style.backgroundPosition = 'center';
      };
      previewImg.onerror = () => {
        previewBox.style.backgroundImage = 'none';
        previewBox.style.backgroundColor = primeiro.cores.fundo;
      };
      previewLabel.textContent = primeiro.nome;
      temaAtualSpan.textContent = primeiro.nome;
      document.getElementById('ajuste-atual').textContent = 'Cobrir';
      document.querySelectorAll('.thumb').forEach(el => el.classList.remove('active'));
      document.querySelector(`.thumb[data-id="${primeiro.id}"]`).classList.add('active');
    });
  </script>
</body>
</html>
